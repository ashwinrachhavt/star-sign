name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 54329:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.12.0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm -r typecheck

      - name: Lint
        run: pnpm -r lint

      - name: Unit tests (core)
        run: pnpm --filter @star-sign/core test

      - name: Database tests (RLS + jobs harness)
        run: pnpm --filter @star-sign/db test
        env:
          STAR_SIGN_TEST_DATABASE_URL: postgres://postgres:postgres@localhost:54329/postgres

  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.12.0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Start local Supabase
        # CLI 3.x removed `--db-password` from `start`; the default
        # local-stack DB password is already `postgres`. Retry: shared
        # runner IPs hit Docker Hub rate limits on fresh image pulls
        # (toomanyrequests) — a resumed start recovers partial stacks.
        run: |
          for i in 1 2 3 4 5; do
            supabase start && exit 0
            echo "supabase start attempt $i failed; retrying in 60s"
            sleep 60
          done
          supabase start

      # Keys are read from the running stack (CLI 3.x no longer ships the
      # fixed legacy demo secrets). These are local-stack keys, not
      # credentials — the stack runs entirely inside this job.
      - name: Export local Supabase keys
        run: supabase status -o env | grep -E '^(ANON_KEY|SERVICE_ROLE_KEY)=' >> "$GITHUB_ENV"

      - name: Install Playwright
        run: pnpm --dir e2e install --no-save && pnpm --dir e2e exec playwright install --with-deps chromium

      - name: Run smoke test
        run: pnpm --dir e2e test
        env:
          SUPABASE_URL: http://localhost:54321
          NEXT_PUBLIC_SUPABASE_URL: http://localhost:54321
          SUPABASE_ANON_KEY: ${{ env.ANON_KEY }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ env.ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ env.SERVICE_ROLE_KEY }}
          SUPABASE_DB_PASSWORD: postgres

      - name: Upload journey evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: journey-evidence
          path: |
            e2e/artifacts/
            e2e/test-results/
          retention-days: 7
          if-no-files-found: ignore
